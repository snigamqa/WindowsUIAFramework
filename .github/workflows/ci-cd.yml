name: Windows framework CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_notepad:
        description: Run Notepad tests on a trusted interactive self-hosted runner
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  framework:
    name: Framework tests and case validation
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate case catalog and collect tests
        run: python -m pytest --collect-only -q -o addopts=
      - name: Run framework tests
        run: python -m pytest -m framework --junitxml=artifacts\framework-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-results
          path: |
            artifacts/framework-results.xml
            artifacts/report.html
          if-no-files-found: warn

  notepad:
    name: Interactive Notepad tests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_notepad && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: [self-hosted, Windows, X64, windows-uia]
    timeout-minutes: 20
    env:
      APP_PATH: C:\Windows\System32\notepad.exe
      APP_BACKEND: uia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Notepad tests
        run: python -m pytest tests\test_notepad.py --junitxml=artifacts\notepad-results.xml
      - name: Upload test results and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notepad-results
          path: |
            artifacts/notepad-results.xml
            artifacts/report.html
            artifacts/evidence/
          if-no-files-found: warn
