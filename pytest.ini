[pytest]
testpaths = tests
timeout = 60
timeout_method = thread
junit_family = legacy
markers =
    smoke: fast smoke tests for critical paths
    flaky: known-unstable tests
    case: link an automated test to a manual case using id and title keyword arguments
    framework: infrastructure-only tests that do not represent application cases
addopts = -v --tb=short --html=artifacts/report.html --self-contained-html
